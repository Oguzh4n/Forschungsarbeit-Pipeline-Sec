# =============================================================================
# HARDENED CI/CD WORKFLOW
#
# This workflow performs the same build-and-test task as insecure.yml but
# applies defensive measures for each vulnerability class. Each control is
# annotated with a comment explaining what it does and which risk it mitigates.
# =============================================================================

name: Secure CI (Hardened Reference)

# CONTROL 1: Trigger separation – use `pull_request` instead of
# `pull_request_target` for build and test steps.
#
# Risk mitigated: Poisoned Pipeline Execution (PPE).
#
# `pull_request` runs in a restricted context: it has NO access to repository
# secrets and has only read-level permissions on the repository contents. This
# means that even if a malicious PR modifies build scripts, it cannot access
# deployment credentials or tokens. Tasks that genuinely need secrets (e.g.
# deployment, publishing) should be handled in a *separate* workflow triggered
# only after a human code review has approved the changes and they have been
# merged into a protected branch.
on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

# CONTROL 2: Restrictive top-level permissions block.
#
# Risk mitigated: Overly permissive GITHUB_TOKEN.
#
# Declaring `permissions` at the workflow level sets a deny-by-default policy.
# Every job inherits these minimal permissions unless it explicitly overrides
# them. `contents: read` is the minimum required to check out source code.
# No write permissions are granted at this level, which limits the blast radius
# if any step is compromised.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # CONTROL 3: Action pinned to a full commit SHA instead of a mutable tag.
      #
      # Risk mitigated: Supply-chain compromise via tag hijacking.
      #
      # Tags like `v4` are mutable pointers that can be silently redirected to
      # any commit by the action's maintainer or an attacker who gains write
      # access to the action repository. A full 40-character commit SHA is
      # immutable: it cryptographically identifies exactly one tree of code.
      # If the SHA changes in a future update of the action, the workflow will
      # fail visibly rather than silently running unknown code. The human-
      # readable version is recorded in the trailing comment for auditability.
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # CONTROL 3b: Disable credential persistence after checkout.
          #
          # Risk mitigated: Credential leakage via build artifacts (artipacked).
          #
          # By default, actions/checkout writes the GITHUB_TOKEN to the local
          # git credential store so that subsequent git operations work without
          # re-authentication. If a later step accidentally uploads the working
          # tree as an artifact, those stored credentials are included.
          # Setting persist-credentials: false removes the token from the git
          # config immediately after checkout. The Maven build does not perform
          # any authenticated git operations, so no functionality is lost.
          persist-credentials: false

      # CONTROL 3 (continued): setup-java also pinned to commit SHA.
      # CONTROL 4: Dependency caching enabled to reduce network exposure and
      # build times. Temurin (Eclipse Adoptium) is the recommended open-source
      # JDK distribution.
      #
      # Risk mitigated: Supply-chain via mutable action tag; also reduces the
      # number of external network calls during the build, which lowers the
      # attack surface for dependency-confusion and MitM attacks on the Maven
      # repository connection.
      - name: Set up Java 17 (Temurin, with Maven cache)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # CONTROL 5: Externally controlled values passed through environment
      # variables, not interpolated directly into shell commands.
      #
      # Risk mitigated: Script injection.
      #
      # GitHub Actions expands `${{ ... }}` expressions *before* the shell
      # parses the command. An attacker can embed shell metacharacters in
      # values they control (e.g. a PR title) to break out of the intended
      # command. By assigning the expression to an environment variable first,
      # the shell receives the raw bytes of the value through the environment
      # rather than through command substitution or argument parsing. Shell
      # metacharacters in the value are therefore inert. Compare with the
      # script injection sink in insecure.yml.
      - name: Log PR metadata safely
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          echo "Building PR: ${PR_TITLE}"
          echo "Submitted by: ${PR_AUTHOR}"

      - name: Build and test with Maven
        run: mvn -B verify --no-transfer-progress

      # CONTROL 6: Static analysis of workflow files with zizmor.
      #
      # Risk mitigated: Misconfigured or vulnerable workflow patterns that
      # evade code review.
      #
      # zizmor (https://github.com/zizmorcore/zizmor) is a static analyser
      # dedicated to GitHub Actions security. It detects issues such as script
      # injection sinks, dangerous trigger combinations (pull_request_target
      # with checkout), missing permission scopes, and unpinned actions. Running
      # it as a CI step means every PR is audited automatically, not just when
      # a security reviewer happens to look at the workflow diff. The action is
      # pinned to a commit SHA for the same reason as the other actions above.
      - name: Run zizmor (workflow static analysis)
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99  # v0.6.3
        with:
          # Scan all workflow files in the repository. insecure.yml is suppressed
          # via .zizmor.yml because its findings are intentional and documented.
          # Every other workflow — including any file introduced by a PR — is
          # scanned at full severity. This means a PR that adds a vulnerable
          # workflow will automatically fail this step before it can be merged.
          inputs: .github/workflows/
          config: .zizmor.yml
          # advanced-security uploads SARIF results to the GitHub Security tab,
          # which requires GitHub Advanced Security (GHAS). Disabled here so the
          # workflow runs on repositories without GHAS enabled.
          advanced-security: false

      # CONTROL 7: Secret scanning with TruffleHog.
      #
      # Risk mitigated: Accidental or intentional credential exposure in the
      # repository history or working tree.
      #
      # TruffleHog scans commits for high-entropy strings and known secret
      # patterns (AWS keys, GitHub tokens, etc.). Running it on every PR
      # prevents developers from accidentally committing credentials and
      # provides a continuous audit trail. The action is pinned to a SHA.
      #
      # Note: The file demo/fake-secrets-for-trufflehog-demo.txt in this
      # repository contains a clearly fake, non-functional credential
      # (AKIAIOSFODNN7EXAMPLE) to demonstrate that TruffleHog detects the
      # pattern. In a real repository you would configure TruffleHog to treat
      # that file as an allowlisted false positive, or remove the demo file
      # entirely.
      - name: Run TruffleHog (secret scanning)
        # if: always() ensures TruffleHog runs even when a previous step (e.g.
        # zizmor) has already failed. This guarantees that both scanners report
        # their findings in the same run, giving reviewers a complete picture
        # of all security issues in the PR rather than stopping at the first one.
        if: always()
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c  # v3.97.4
        with:
          # Scan the diff introduced by this event rather than the full history.
          # For pull_request events, compare the PR base SHA to the PR head SHA.
          # For push events, compare the commit before the push to the new HEAD.
          # Using event-specific SHAs avoids the "base == HEAD" error that occurs
          # when the default branch name is used on a push-to-main event.
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # --only-verified is intentionally omitted. Without it, TruffleHog
          # reports all pattern matches — verified and unverified — and exits
          # non-zero if any are found. This catches accidentally committed
          # credentials even when TruffleHog cannot confirm they are still
          # active (e.g. a key that has already been rotated). The trade-off
          # is a higher false-positive rate; teams should allowlist known
          # false positives rather than re-enabling --only-verified.
